<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#dce8f8" />
  <meta name="description" content="Virtual Validation System" />
  <title>Virtual Validation System | CR3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #26344d;
      --muted: #71809a;
      --glass: rgba(255, 255, 255, .37);
      --glass-border: rgba(255, 255, 255, .72);
      --blue: #6689c7;
      --violet: #8d7bc8;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      font-family: 'Manrope', sans-serif;
      background:
        radial-gradient(ellipse at 15% 18%, rgba(255,255,255,.95) 0%, transparent 34%),
        radial-gradient(ellipse at 84% 14%, rgba(190,210,255,.9) 0%, transparent 34%),
        radial-gradient(ellipse at 82% 88%, rgba(224,202,255,.82) 0%, transparent 36%),
        radial-gradient(ellipse at 12% 88%, rgba(188,226,239,.85) 0%, transparent 34%),
        linear-gradient(135deg, #dce8f8 0%, #e9e5f7 48%, #d9eaf1 100%);
      background-attachment: fixed;
    }
    .scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .62; animation: drift 18s ease-in-out infinite alternate; }
    .orb.one { width: 360px; height: 360px; top: -125px; left: -85px; background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(167,204,245,.3)); box-shadow: inset -20px -25px 60px rgba(125,155,210,.14), 0 30px 90px rgba(105,140,190,.12); }
    .orb.two { width: 480px; height: 480px; right: -190px; bottom: -220px; background: linear-gradient(145deg, rgba(255,255,255,.75), rgba(198,174,239,.32)); box-shadow: inset 20px 20px 65px rgba(255,255,255,.3), 0 30px 100px rgba(132,111,183,.12); animation-delay: -6s; }
    .orb.three { width: 180px; height: 180px; right: 17%; top: 17%; background: linear-gradient(145deg, rgba(255,255,255,.7), rgba(160,194,229,.22)); animation-delay: -10s; }
    .orb.four { width: 120px; height: 120px; left: 17%; bottom: 13%; background: linear-gradient(145deg, rgba(255,255,255,.8), rgba(185,170,230,.3)); animation-delay: -3s; }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(28px,-24px,0) scale(1.08); } }

    .login-card {
      position: relative;
      z-index: 1;
      width: min(440px, 100%);
      padding: 54px 48px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.64), rgba(255,255,255,.24));
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      backdrop-filter: blur(28px) saturate(150%);
      box-shadow: 0 32px 90px rgba(67, 91, 132, .17), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25);
      animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
      transition: transform .45s ease, box-shadow .45s ease, border-color .45s ease;
    }
    .login-card::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 31px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,.95), transparent 42%, rgba(255,255,255,.45));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .login-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,.95); box-shadow: 0 42px 110px rgba(67,91,132,.22), inset 0 1px 0 rgba(255,255,255,.95); }
    @keyframes appear { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .logo-wrap {
      width: 126px;
      height: 126px;
      padding: 7px;
      margin-bottom: 28px;
      border-radius: 25px;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 15px 35px rgba(75,102,148,.13), inset 0 1px 3px rgba(255,255,255,.95);
      animation: float 5s ease-in-out infinite;
    }
    .logo-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 17px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    h1 { margin: 0; color: #2d3b55; font-size: clamp(25px, 5vw, 31px); line-height: 1.25; font-weight: 800; letter-spacing: -.8px; }
    .title-line { display: block; }
    .login-button {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 100%;
      min-height: 60px;
      margin-top: 38px;
      padding: 0 25px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(115deg, #6f91cc 0%, #827fc4 52%, #9a83c9 100%);
      box-shadow: 0 13px 28px rgba(104,126,190,.29), inset 0 1px 0 rgba(255,255,255,.35);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      transition: transform .28s ease, box-shadow .28s ease, filter .28s ease;
    }
    .login-button::before {
      content: '';
      position: absolute;
      z-index: -1;
      top: -100%;
      left: -45%;
      width: 35%;
      height: 300%;
      transform: rotate(25deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
      transition: left .7s ease;
    }
    .login-button:hover { transform: translateY(-4px); filter: saturate(1.08) brightness(1.05); box-shadow: 0 20px 38px rgba(104,126,190,.38), 0 0 0 6px rgba(255,255,255,.25), inset 0 1px 0 rgba(255,255,255,.45); }
    .login-button:hover::before { left: 125%; }
    .login-button:active { transform: translateY(-1px) scale(.99); }
    .login-button svg { width: 18px; height: 18px; transition: transform .25s ease; }
    .login-button:hover svg { transform: translateX(5px); }
    .login-button:focus-visible { outline: 3px solid rgba(91,119,184,.45); outline-offset: 5px; }

    .ambient-glow { position: fixed; width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,.38); filter: blur(65px); pointer-events: none; transform: translate(-50%,-50%); opacity: 0; transition: opacity .3s ease; }
    @media (pointer: fine) { body:hover .ambient-glow { opacity: .65; } }
    @media (max-width: 520px) {
      body { padding: 20px; }
      .login-card { padding: 43px 27px 32px; border-radius: 27px; }
      .logo-wrap { width: 108px; height: 108px; margin-bottom: 25px; }
      .login-button { margin-top: 32px; }
      .orb.one { width: 260px; height: 260px; }
      .orb.two { width: 340px; height: 340px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <div class="orb four"></div>
  </div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="login-card">
    <div class="logo-wrap">
      <img src="logo.png" alt="CR3" />
    </div>
    <h1><span class="title-line">Virtual Validation</span><span class="title-line">System</span></h1>
    <a class="login-button" href="https://script.google.com/macros/s/AKfycbyYnvvOVcLdmmS0PAvyaFhg-Q7hzJKMbls5u0uhNe6PRAk8gbCLDvrNWkALszM8n9w/exec" target="_blank" rel="noopener noreferrer" aria-label="Open Virtual Validation System login">
      LOGIN
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </main>

  <script>
    // Gentle cursor-following light for desktop; no effect on touch devices.
    if (window.matchMedia('(pointer: fine)').matches) {
      const glow = document.querySelector('.ambient-glow');
      window.addEventListener('pointermove', (event) => {
        glow.style.left = event.clientX + 'px';
        glow.style.top = event.clientY + 'px';
      }, { passive: true });
    }
  </script>
</body>
</html>
